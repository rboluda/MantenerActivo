# Compila MantenerActivo.exe y lo publica en una Release al subir una etiqueta v*
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Compilar
        run: pyinstaller MantenerActivo.spec --noconfirm

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MantenerActivo.exe
